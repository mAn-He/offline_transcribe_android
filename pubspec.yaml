name: webapp
description: Offline multilingual meeting minutes generator optimized for Galaxy S24+ with on-device AI (Whisper + Llama) via direct FFI
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.3
  flutter_downloader: ^1.11.6
  workmanager: ^0.5.2
  ffmpeg_kit_flutter_min: ^6.0.3
  file_picker: ^8.0.5
  # ^0.3.0 did NOT exist on pub.dev (latest stable is 0.2.2), so `pub get` failed.
  # Pinned to a resolvable stable version. IMPORTANT: 0.2.x predates Gemma 4
  # (April 2026); to actually LOAD Gemma 4 GGUFs you must bump to the prerelease
  # that bundles a recent llama.cpp, e.g.  llama_cpp_dart: ^0.9.0-dev.9
  # (and then verify the API used in lib/src/llm/llm.dart still matches).
  llama_cpp_dart: ^0.2.2
  # NOTE: map-reduce is implemented directly in lib/src/llm/llm.dart, so the
  # langchain_dart dependency was removed (it was never imported).
  collection: ^1.18.0
  shared_preferences: ^2.2.3

  # For JSON and isolates convenience
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^12.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

# ffigen config lives in ffigen.yaml
